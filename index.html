<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <title>Super Clássico</title>
    <meta name="description" content="Controle de mensalidade, presença e financeiro do Super Clássico — Vasco x Flamengo, toda quarta no Campo do Furão." />

    <meta name="theme-color" content="#000000" />
    <meta name="background-color" content="#000000" />

    <!-- iOS: comportamento de app em tela cheia -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Super Clássico" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

    <!-- Android / geral -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />

    <style>
      html, body { margin: 0; padding: 0; background: #000000; height: 100%; }
      #root { min-height: 100dvh; }

      #splash{
        position:fixed; inset:0; z-index:9999; background:#000000;
        display:flex; flex-direction:column; align-items:center; justify-content:center;
        transition:opacity 0.5s ease; opacity:1;
      }
      #splash.splash-hide{ opacity:0; pointer-events:none; }
      .splash-terminal{
        font-family:'IBM Plex Mono','SFMono-Regular',Consolas,monospace; font-size:13px; line-height:1.7;
        color:#4FC3F7; text-align:left; min-width:240px; min-height:76px; margin-top:18px;
      }
      .splash-terminal .line-prefix{ color:#7C4DFF; }
      .splash-cursor{ color:#4FC3F7; animation:splash-blink 0.9s steps(1) infinite; }
      .splash-frame{
        position:relative; width:280px; max-width:70vw;
        animation:splash-pop 0.5s ease;
      }
      .splash-frame img{ display:block; width:100%; height:auto; }
      @keyframes splash-pop{ from{ opacity:0; transform:scale(0.92); } to{ opacity:1; transform:scale(1); } }
      @keyframes splash-blink{ 50%{ opacity:0; } }
      @media (prefers-reduced-motion: reduce){
        .splash-cursor{ animation:none; }
      }
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <div class="splash-frame">
        <img src="/appvia-logo.jpg" alt="AppVia" width="280" height="280">
      </div>
      <div class="splash-terminal"><span id="splashTermOut"></span><span class="splash-cursor">&#9608;</span></div>
    </div>
    <script>
      (function(){
        var lines = ['carregando appvia', 'compilando </> interface', 'pronto.'];
        var out = document.getElementById('splashTermOut');
        if(!out){ return; }
        var li = 0, ci = 0;
        function typeChar(){
          if(!document.body.contains(out)) return;
          if(li >= lines.length){
            setTimeout(function(){
              if(!document.body.contains(out)) return;
              out.innerHTML = '';
              li = 0; ci = 0;
              typeChar();
            }, 700);
            return;
          }
          var line = lines[li];
          if(ci === 0){
            out.innerHTML += (li > 0 ? '<br>' : '') + '<span class="line-prefix">&gt; </span><span class="line-text' + li + '"></span>';
          }
          var current = out.querySelector('.line-text' + li);
          current.textContent += line.charAt(ci);
          ci++;
          if(ci >= line.length){
            li++; ci = 0;
            setTimeout(typeChar, 260);
          } else {
            setTimeout(typeChar, 32 + Math.random() * 40);
          }
        }
        typeChar();
      })();
      setTimeout(function(){
        var s = document.getElementById('splash');
        if(!s) return;
        s.classList.add('splash-hide');
        setTimeout(function(){ s.remove(); }, 550);
      }, 4000);
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
